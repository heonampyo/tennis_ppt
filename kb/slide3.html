<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>하나증권 테니스 대회 사례 요약</title>
	<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
	<style>
		html {
			font-size: 1.25vw; /* Base font size for scaling, 16px at 1280px width */
		}
		body {
			font-family: 'Noto Sans KR', sans-serif;
			background-color: white;
			margin: 0;
			padding: 0;
			overflow: hidden;
			height: 100vh;
		}
		.slide-container {
			width: 100%;
			height: 100%;
			position: relative;
			overflow: hidden;
			box-sizing: border-box;
		}
		.kb-yellow {
			color: #FFCC00;
		}
		.kb-bg-yellow {
			background-color: #FFCC00;
		}
		.kb-dark {
			color: #333333;
		}
		.hana-green {
			color: #00857E;
		}
		.hana-bg-green {
			background-color: #00857E;
		}
		.pattern-bg {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-image: linear-gradient(rgba(255,255,255,0.96), rgba(255,255,255,0.96)),
			url('https://img.freepik.com/premium-vector/tennis-ball-seamless-pattern_160308-135.jpg');
			background-size: 18.75rem; /* 300px */
			z-index: -1;
		}
		.side-accent {
			position: absolute;
			width: 0.75rem; /* 12px */
			height: 80%;
			background-color: #FFCC00;
			top: 10%;
			left: 0;
			z-index: 1;
		}
		.title-section {
			border-left: 0.3125rem solid #FFCC00; /* 5px */
			padding-left: 1.5625rem; /* 25px */
		}
		.content-box {
			background-color: rgba(255, 255, 255, 0.85);
			border-radius: 0.625rem; /* 10px */
			box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.08); /* 4px 12px */
		}
		.key-point {
			display: flex;
			align-items: flex-start;
			margin-bottom: 1.125rem; /* 18px */
			padding: 0.75rem 1rem; /* 12px 16px */
			background-color: rgba(0, 133, 126, 0.05);
			border-radius: 0.5rem; /* 8px */
			border-left: 0.25rem solid #00857E; /* 4px */
		}
		.key-point-icon {
			flex-shrink: 0;
			width: 2.25rem; /* 36px */
			height: 2.25rem; /* 36px */
			background-color: #00857E;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-right: 1rem; /* 16px */
		}
		.corner-accent {
			position: absolute;
			width: 12.5rem; /* 200px */
			height: 12.5rem; /* 200px */
			background-color: #00857E;
			opacity: 0.05;
			z-index: -1;
		}
		.bottom-right {
			bottom: -6.25rem; /* -100px */
			right: -6.25rem; /* -100px */
			border-radius: 12.5rem 0 0 0; /* 200px */
		}
	</style>
</head>
<body>
<div class="slide-container flex flex-col p-12">
	<div class="pattern-bg"></div>
	<div class="side-accent"></div>
	<div class="corner-accent bottom-right"></div>

	<!-- 헤더 로고 및 제목 -->
	<div class="w-full flex justify-between items-center mb-8">
		<img src="./KB_logo_2020.jpg" alt="KB국민은행 로고" class="h-10">
		<p class="text-sm kb-dark">KB국민은행 테니스 대회 예산안 및 하나증권 사례 비교</p>
	</div>

	<!-- 메인 콘텐츠 영역 -->
	<div class="flex flex-row h-full">
		<!-- 좌측 제목 영역 -->
		<div class="w-1/3 pr-8">
			<div class="title-section h-full flex flex-col justify-center">
				<h2 class="text-4xl font-bold kb-dark mb-6">하나증권<br>테니스 대회<br>사례 요약</h2>
				<div class="w-16 h-1 kb-bg-yellow mb-4"></div>
				<p class="text-lg text-gray-600 mt-4">스포츠 마케팅을 통한<br>고객 유치 성공 사례</p>

				<div class="mt-8 p-4 bg-white rounded-lg shadow-sm">
					<div class="flex items-center justify-center">
						<img src="https://www.hanaw.com/assets/imgs/pc/common/logo.png" alt="하나증권 로고" class="h-8 mb-4">
					</div>
					<div class="flex items-center justify-center mt-2">
						<div class="w-10 h-10 rounded-full hana-bg-green flex items-center justify-center">
							<i class="fas fa-trophy text-white"></i>
						</div>
						<div class="ml-2 w-10 h-10 rounded-full hana-bg-green flex items-center justify-center">
							<i class="fas fa-tennis-ball text-white"></i>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- 우측 내용 영역 -->
		<div class="w-2/3 pl-8">
			<div class="content-box p-8 h-full">
				<h3 class="text-2xl font-bold hana-green mb-6">대회 주요 정보</h3>

				<div class="key-point">
					<div class="key-point-icon">
						<i class="fas fa-wallet text-white"></i>
					</div>
					<div>
						<h4 class="text-lg font-bold mb-1">예산</h4>
						<p class="text-base">약 <span class="text-xl font-bold">1.5억 원</span> (참가비 제외)</p>
						<p class="text-sm text-gray-600">*참가자들의 참가비를 제외한 순수 운영 예산</p>
					</div>
				</div>

				<div class="key-point">
					<div class="key-point-icon">
						<i class="fas fa-users text-white"></i>
					</div>
					<div>
						<h4 class="text-lg font-bold mb-1">참가 규모</h4>
						<p class="text-base"><span class="text-xl font-bold">672팀 (1,344명)</span>, 중복 신청 허용</p>
						<p class="text-sm text-gray-600">*다양한 부서에 동일 참가자 중복 참여 가능</p>
					</div>
				</div>

				<div class="key-point">
					<div class="key-point-icon">
						<i class="fas fa-check-circle text-white"></i>
					</div>
					<div>
						<h4 class="text-lg font-bold mb-1">참가 조건</h4>
						<p class="text-base"><span class="font-bold">하나증권 계좌 보유</span> 시 신청 가능</p>
						<p class="text-sm text-gray-600">*계좌 개설을 유도하는 마케팅 전략</p>
					</div>
				</div>

				<div class="key-point mb-0">
					<div class="key-point-icon">
						<i class="fas fa-gift text-white"></i>
					</div>
					<div>
						<h4 class="text-lg font-bold mb-1">참가자 혜택</h4>
						<p class="text-base"><span class="font-bold">3만원 상당</span> 혜택 제공</p>
						<p class="text-sm text-gray-600">*API 개발, 브랜드 굿즈, 캠페인 등 포함</p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 하단 페이지 번호 -->
	<div class="w-full flex justify-end mt-4">
		<div class="kb-bg-yellow rounded-full w-8 h-8 flex items-center justify-center">
			<span class="text-white font-medium">3</span>
		</div>
	</div>
</div>
</body>
</html>
