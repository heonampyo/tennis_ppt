<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KB국민은행 테니스 대회 예산안</title>
	<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
	<style>
		html {
			font-size: 1.8vmin; /* Use vmin to adapt to both width and height, ensuring visibility */
		}
		body {
			font-family: 'Noto Sans KR', sans-serif;
			background-color: white;
			margin: 0;
			padding: 0;
			overflow: hidden;
			height: 100vh; /* Full viewport height */
		}
		.slide-container {
			width: 100%;
			height: 100%;
			position: relative;
			overflow: hidden;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
		}
		.kb-yellow {
			color: #FFCC00;
		}
		.kb-bg-yellow {
			background-color: #FFCC00;
		}
		.kb-dark {
			color: #333333;
		}
		.tennis-ball {
			width: 3.75rem; /* 60px */
			height: 3.75rem; /* 60px */
			border-radius: 50%;
			background-color: #FFCC00;
			position: relative;
			box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,0.2); /* 4px 8px */
		}
		.tennis-ball::before {
			content: "";
			position: absolute;
			width: 3.625rem; /* 58px */
			height: 3.625rem; /* 58px */
			top: 0.0625rem; /* 1px */
			left: 0.0625rem; /* 1px */
			border-radius: 50%;
			border: 0.125rem dashed white; /* 2px */
		}
		.pattern-bg {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-image: linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
			url('https://img.freepik.com/premium-vector/tennis-ball-seamless-pattern_160308-135.jpg');
			background-size: 18.75rem; /* 300px */
			z-index: -1;
		}
		.corner-accent {
			position: absolute;
			width: 20rem; /* 320px */
			height: 20rem; /* 320px */
			background-color: #FFCC00;
			opacity: 0.8;
			z-index: -1;
		}
		.top-left {
			top: -10rem; /* -160px */
			left: -10rem; /* -160px */
			border-radius: 0 0 20rem 0; /* 320px */
		}
		.bottom-right {
			bottom: -10rem; /* -160px */
			right: -10rem; /* -160px */
			border-radius: 20rem 0 0 0; /* 320px */
		}
		.border-pattern {
			border: 0.3125rem solid transparent; /* 5px */
			border-image: linear-gradient(45deg, #FFCC00, #FFD700, #FFCC00) 1;
		}
	</style>
</head>
<body>
<div class="slide-container flex flex-col items-center p-12 border-pattern">
	<div class="pattern-bg"></div>
	<div class="corner-accent top-left"></div>
	<div class="corner-accent bottom-right"></div>

	<!-- 헤더 로고 -->
	<div class="w-full flex justify-between items-center flex-shrink-0">
		<img src="./KB_logo_2020.jpg" alt="KB국민은행 로고" class="h-12">
		<div class="tennis-ball"></div>
	</div>

	<!-- 중앙 제목 영역 -->
	<div class="flex flex-grow flex-col items-center justify-center text-center z-10">
		<h1 class="text-5xl font-bold kb-dark mb-6 leading-tight">KB국민은행 테니스 대회 예산안 및<br>하나증권 사례 비교</h1>
		<div class="w-20 h-1 kb-bg-yellow my-6"></div>
		<h2 class="text-2xl kb-dark font-medium mt-4">Young Customers 마케팅을 위한 스포츠 커뮤니티 전략</h2>

		<div class="flex items-center mt-12">
			<i class="fas fa-tennis-ball kb-yellow text-2xl mr-3"></i>
			<i class="fas fa-trophy kb-yellow text-2xl"></i>
		</div>
	</div>
</div>
</body>
</html>
