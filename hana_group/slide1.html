<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>하나금융지주 계열사 테니스 대회 보고서</title>
	<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
	<style>
		body {
			font-family: 'Noto Sans KR', sans-serif;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #f0f0f0;
		}
		.slide-container {
			width: 100vw;
			height: 100vh;
			box-sizing: border-box;
			position: relative;
			background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
			overflow: hidden;
			padding: 8vh 8vw;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}
		.accent-bar {
			position: absolute;
			width: 100%;
			height: 1.2vh;
			background: linear-gradient(90deg, #00857d 0%, #0078c1 100%);
			top: 0;
			left: 0;
		}
		.logo {
			position: absolute;
			top: 5vh;
			right: 5vw;
			width: 12vw;
			max-width: 150px;
		}
		.tennis-icon {
			position: absolute;
			bottom: 5vh;
			right: 5vw;
			color: #00857d;
			opacity: 0.1;
			font-size: 25vmin;
		}
		.title-container {
			width: 100%;
		}
		.subtitle {
			display: inline-block;
			background-color: rgba(0, 133, 125, 0.1);
			color: #00857d;
			padding: 1.5vh 2vw;
			border-radius: 4px;
			margin-bottom: 3vh;
			font-size: clamp(16px, 2vw, 22px);
		}
		h1 {
			font-size: clamp(32px, 5vw, 60px);
			font-weight: 700;
			color: #333;
			line-height: 1.3;
			margin-bottom: 2vh;
		}
		.year-badge {
			display: inline-block;
			background-color: #0078c1;
			color: white;
			padding: 0.8vh 1.5vw;
			border-radius: 20px;
			font-size: clamp(14px, 1.5vw, 18px);
			margin-top: 2vh;
		}
		.footer {
			position: absolute;
			bottom: 5vh;
			left: 8vw;
			font-size: clamp(12px, 1.2vw, 14px);
			color: #666;
		}
		.divider {
			width: 12vw;
			max-width: 120px;
			height: 5px;
			background-color: #00857d;
			margin: 4vh 0;
		}
		p {
			font-size: clamp(18px, 2.2vw, 26px);
			color: #555;
			line-height: 1.6;
		}
	</style>
</head>
<body>
<div class="slide-container">
	<div class="accent-bar"></div>

	<div class="title-container">
		<div class="subtitle">종합 분석 보고서</div>
		<h1>하나금융지주 계열사<br>테니스 대회 보고서</h1>
		<div class="year-badge">2024-2025</div>

		<div class="divider"></div>

		<p>
			프로 선수 대회 및 동호인 대회 현황 분석<br>
			대회 파트너십 및 스폰서십 현황
		</p>
	</div>
</div>
</body>
</html>
